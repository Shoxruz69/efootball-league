<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shield Frame: Blue & Yellow -->
  <path d="M50 4 C76 4, 88 16, 88 42 C88 74, 50 96, 50 96 C50 96, 12 74, 12 42 C12 16, 24 4, 50 4 Z" fill="#003399" stroke="#ffcc00" stroke-width="3"/>
  <clipPath id="pak-shield">
    <path d="M50 6 C74 6, 86 17, 86 42 C86 72, 50 93, 50 93 C50 93, 14 72, 14 42 C14 17, 26 6, 50 6 Z"/>
  </clipPath>
  <g clip-path="url(#pak-shield)">
    <!-- Blue Background with Yellow Stripes -->
    <rect x="10" y="6" width="80" height="90" fill="#003399"/>
    <polygon points="50,6 64,6 36,93 22,93" fill="#ffcc00"/>
    <polygon points="76,6 88,6 62,93 50,93" fill="#ffcc00"/>
    <!-- Center White Disc -->
    <circle cx="50" cy="46" r="18" fill="#ffffff" stroke="#ffcc00" stroke-width="2"/>
    <!-- Cotton Boll / Football Silhouette -->
    <circle cx="50" cy="46" r="14" fill="#ffcc00"/>
    <path d="M46 42 L54 42 L57 48 L50 52 L43 48 Z" fill="#003399"/>
    <!-- Text: PAKHTAKOR -->
    <text x="50" y="80" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAXTAKOR</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Royal Crown on Top -->
  <g id="crown">
    <path d="M30 26 C30 18, 50 14, 50 14 C50 14, 70 18, 70 26 L74 20 L66 12 L50 20 L34 12 L26 20 Z" fill="#ffd700" stroke="#b8860b" stroke-width="1.2"/>
    <circle cx="50" cy="11" r="2.5" fill="#ffffff" stroke="#b8860b" stroke-width="0.8"/>
    <circle cx="34" cy="12" r="2" fill="#ffd700"/>
    <circle cx="66" cy="12" r="2" fill="#ffd700"/>
    <rect x="30" y="24" width="40" height="5" rx="2" fill="#d90429" stroke="#ffd700" stroke-width="1"/>
    <!-- Jewels on Crown band -->
    <circle cx="36" cy="26.5" r="1.2" fill="#ffffff"/>
    <circle cx="43" cy="26.5" r="1.2" fill="#004d98"/>
    <circle cx="50" cy="26.5" r="1.2" fill="#ffffff"/>
    <circle cx="57" cy="26.5" r="1.2" fill="#004d98"/>
    <circle cx="64" cy="26.5" r="1.2" fill="#ffffff"/>
  </g>
  <!-- Circular Badge -->
  <circle cx="50" cy="58" r="34" fill="#ffffff" stroke="#ffd700" stroke-width="4"/>
  <circle cx="50" cy="58" r="30" fill="#ffffff" stroke="#004d98" stroke-width="1.5"/>
  <!-- Diagonal Purple Sash -->
  <clipPath id="rm-circle">
    <circle cx="50" cy="58" r="29"/>
  </clipPath>
  <g clip-path="url(#rm-circle)">
    <polygon points="20,30 85,95 72,108 7,43" fill="#5c2d91"/>
  </g>
  <!-- Monogram M C F in Gold -->
  <text x="50" y="65" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="24" fill="#ffd700" stroke="#b8860b" stroke-width="0.8" text-anchor="middle" letter-spacing="1">MCF</text>
</svg>

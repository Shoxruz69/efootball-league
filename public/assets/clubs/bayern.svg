<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Red Ring -->
  <circle cx="50" cy="50" r="46" fill="#dc052d" stroke="#ffffff" stroke-width="2"/>
  <!-- Blue Ring -->
  <circle cx="50" cy="50" r="42" fill="#0066b2"/>
  <!-- Inner Red Ring -->
  <circle cx="50" cy="50" r="38" fill="#dc052d"/>
  <!-- Text Ring: FC BAYERN MUNCHEN -->
  <text x="50" y="24" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">FC BAYERN</text>
  <text x="50" y="85" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MÜNCHEN</text>
  <!-- Center White Circle -->
  <circle cx="50" cy="52" r="22" fill="#ffffff" stroke="#0066b2" stroke-width="1.5"/>
  <!-- Bavarian Lozenges (Diamonds Pattern) -->
  <clipPath id="bay-center">
    <circle cx="50" cy="52" r="21"/>
  </clipPath>
  <g clip-path="url(#bay-center)" transform="rotate(-30 50 52)">
    <rect x="25" y="25" width="50" height="55" fill="#ffffff"/>
    <!-- Blue diamond lines -->
    <path d="M20 20 L80 20 L60 80 L0 80 Z" fill="none"/>
    <polygon points="30,30 40,40 30,50 20,40" fill="#0066b2"/>
    <polygon points="50,30 60,40 50,50 40,40" fill="#0066b2"/>
    <polygon points="70,30 80,40 70,50 60,40" fill="#0066b2"/>
    <polygon points="40,50 50,60 40,70 30,60" fill="#0066b2"/>
    <polygon points="60,50 70,60 60,70 50,60" fill="#0066b2"/>
    <polygon points="50,70 60,80 50,90 40,80" fill="#0066b2"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>eFootball League</title>

  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Rubik (400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets with Cache Busting -->
  <link rel="stylesheet" href="css/style.css?v=20261027_06">
  <link rel="stylesheet" href="css/animations.css?v=20261027_06">

  <style>
    /* Pure Solid Black Background (#000000) - No Neon Image */
    html, body {
      background-color: #000000 !important;
      background-image: none !important;
      background: #000000 !important;
      color: #ffffff;
    }
    .app-container {
      background-color: #000000 !important;
      background-image: none !important;
      background: #000000 !important;
    }

    @media (min-width: 600px) {
      html, body {
        background-color: #000000 !important;
        background-image: none !important;
        background: #000000 !important;
      }
      .app-container {
        background-color: #000000 !important;
        background-image: none !important;
        background: #000000 !important;
      }
    }

    /* Cards in Natija & Profil: Exactly matching Jadval's dark card styling */
    .state-box,
    .white-card {
      background: #1c1c22 !important;
      border-radius: 14px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35) !important;
      color: #ffffff !important;
    }
    .state-box svg.i {
      color: #19c9ff !important;
    }
    .state-box h3,
    .white-card b,
    .white-card b.big,
    .white-card b.sub-big {
      color: #ffffff !important;
    }
    .state-box p,
    .white-card small {
      color: #8b8b96 !important;
    }

    /* Bottom Navigation Bar: transparent with solid black background continuing behind it */
    .bottom-nav-bar {
      background: transparent !important;
      border-top: none !important;
    }

    /* All 3 navigation tabs: blue-cyan theme, white text, white icons */
    .bottom-nav-bar .pill {
      background: linear-gradient(135deg, rgba(12, 55, 130, 0.75) 0%, rgba(0, 145, 210, 0.65) 100%) !important;
      border: 1px solid rgba(0, 210, 255, 0.35) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(0, 40, 100, 0.35) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .bottom-nav-bar .pill svg.i {
      stroke: #ffffff !important;
      color: #ffffff !important;
    }
    .bottom-nav-bar .pill span {
      color: #ffffff !important;
      font-weight: 500;
    }

    /* Active Tab: Bright Glowing Blue-Cyan Gradient */
    .bottom-nav-bar .pill.on,
    .bottom-nav-bar .pill.active {
      background: linear-gradient(90deg, #0066ff 0%, #00d2ff 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 18px rgba(0, 210, 255, 0.6), 0 0 10px rgba(0, 102, 255, 0.4) !important;
    }
    .bottom-nav-bar .pill.on span,
    .bottom-nav-bar .pill.active span {
      font-weight: 700;
      color: #ffffff !important;
    }
    .bottom-nav-bar .pill.on svg.i,
    .bottom-nav-bar .pill.active svg.i {
      stroke: #ffffff !important;
      color: #ffffff !important;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
    }

    /* Titles, Icons, and Subtitles: High Contrast White/Light */
    .top-header {
      background: transparent !important;
      color: rgba(255, 255, 255, 0.85) !important;
    }
    .top-header-title {
      color: #ffffff !important;
    }
    .top-header-icon {
      color: #19c9ff !important;
    }
    #headerLeagueText {
      color: #ffffff !important;
    }
    .view-title-row h1,
    .view-header h1 {
      color: #ffffff !important;
    }
    .view-title-row svg.i {
      color: #19c9ff !important;
      stroke: #19c9ff !important;
    }
    .view-subtitle {
      color: rgba(255, 255, 255, 0.78) !important;
    }
    .table-header-row {
      color: rgba(255, 255, 255, 0.75) !important;
    }
  </style>
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- Top Status / Header Bar -->
    <header class="top-header">
      <div class="top-header-title" id="headerLeagueTitle">
        <svg class="i top-header-icon" viewBox="0 0 24 24">
          <path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10"/>
        </svg>
        <span id="headerLeagueText">eFootball Uzbekistan Masters • 1-Mavsum</span>
      </div>

      <div class="top-header-user" id="headerUserTag">
        <span class="user-status-pill">
          <span class="dot"></span>
          <span>Yuklanmoqda...</span>
        </span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <div class="state-box" id="initialLoadingSpinner">
        <div class="spinner"></div>
        <div style="font-weight: 500; color: var(--text-secondary); margin-top: 10px;">
          Turnir yuklanmoqda...
        </div>
        <div style="margin-top: 14px; display: none;" id="fallbackRetryBtn">
          <button class="pill on" onclick="if(window.App) App.navigateTo('standings'); else location.reload();">
            Qayta urinish
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Strictly 3 tabs) -->
    <nav class="bottom-nav-bar" id="bottomNav">
      <!-- 1. Jadval -->
      <button class="pill on" data-view="standings" id="tabStandings" type="button">
        <svg class="i" viewBox="0 0 24 24">
          <path d="M5 20V10M12 20V4M19 20v-7"/>
        </svg>
        <span>Jadval</span>
      </button>

      <!-- 2. Natija -->
      <button class="pill" data-view="matches" id="tabMatches" type="button">
        <svg class="i" viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M8 8h8M8 12h8M8 16h5"/>
        </svg>
        <span>Natija</span>
      </button>

      <!-- 3. Profil -->
      <button class="pill" data-view="profile" id="tabProfile" type="button">
        <svg class="i" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>
        </svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="js/tg.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/standings.js"></script>
  <script src="js/views/matches.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/register.js"></script>
  <script src="js/views/adminView.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Safeguard timeout
    setTimeout(function() {
      var spinner = document.getElementById('initialLoadingSpinner');
      if (spinner) {
        if (window.App && typeof window.App.navigateTo === 'function') {
          window.App.navigateTo('standings');
        }
        var retry = document.getElementById('fallbackRetryBtn');
        if (retry) retry.style.display = 'block';
      }
    }, 2500);
  </script>
</body>
</html>

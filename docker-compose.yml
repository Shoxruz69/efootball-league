version: '3.8'

services:
  efootball-app:
    build: .
    container_name: efootball-league-app
    restart: always # 24/7 auto-restart on system reboot or unexpected crash
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      # Persistent storage: data survives container rebuilds and system reboots
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Nginx Reverse Proxy Configuration for eFootball Mini App & Telegram Bot
# Joylashtirish: /etc/nginx/sites-available/efootball.conf
# Faollashtirish: sudo ln -s /etc/nginx/sites-available/efootball.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # O'z domeningizni yozing

    # Let's Encrypt Certbot SSL avtomatik yangilanishi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Barcha HTTP so'rovlarni avtomatik HTTPS ga yo'naltirish
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com; # O'z domeningizni yozing

    # SSL sertifikatlar (Certbot o'rnatgach avtomatik ulanadi)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Xavfsizlik shifrlari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Skrinshot yuklash uchun maksimal hajm (20MB)
    client_max_body_size 20M;

    # Telegram Mini App kesh va xavfsizlik sarlavhalari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Telegram iframe ichida ochilishi uchun X-Frame-Options ni ruxsat berish:
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram:;" always;

    # Asosiy Node.js Express serveriga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Real mijoz IP manzili va sarlavhalarini uzatish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keshni boshqarish
        proxy_buffering off;
    }

    # WebSocket (Jonli hisob yangilanishlari uchun)
    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Statik yuklangan skrinshotlarni kesh qilish
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
